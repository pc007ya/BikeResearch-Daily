name: Weekly Friday Global Sales Data Update

on:
  schedule:
    # 00:00 UTC Friday = 台灣時間每週五 08:00 CST
    - cron: "0 0 * * 5"
  workflow_dispatch:
    inputs:
      max_bulletins:
        description: "每次撈取保留最新銷售快訊筆數"
        required: false
        default: "15"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-daily-bike"
  cancel-in-progress: false

jobs:
  crawl-weekly-sales:
    outputs:
      published_sha: ${{ steps.commit.outputs.published_sha }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run weekly Friday global sales crawler & dataset validation
        run: |
          python3 -m pipeline.update_sales_weekly \
            --docs-dir docs \
            --max-bulletins "${{ github.event.inputs.max_bulletins || '15' }}"

      - name: Commit updated weekly sales dataset
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sales_market.json docs/data/zh_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(weekly-sales): refresh global bicycle sales data & bulletins ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin main
            git push
          else
            echo "No sales dataset changes to commit."
          fi
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-pages:
    needs: [crawl-weekly-sales]
    if: always() && needs.crawl-weekly-sales.result == 'success'
    runs-on: ubuntu-latest
    steps:
      # A scheduled/manual checkout defaults to the old triggering commit, not
      # the output the crawler just pushed. Build from main at job start so
      # neither a delayed push nor a weekly update republishes an old snapshot.
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Verify Pages snapshot
        env:
          CRAWLER_SHA: ${{ needs.crawl-weekly-sales.outputs.published_sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "Pages snapshot: $head_sha"
          if [[ -n "$CRAWLER_SHA" && "$head_sha" != "$CRAWLER_SHA" ]]; then
            # If main advanced during the run, include the successful crawl
            # plus newer changes; never upload the earlier triggering tree.
            git fetch --no-tags --unshallow origin refs/heads/main
            git merge-base --is-ancestor "$CRAWLER_SHA" "$head_sha"
          fi
          test -s docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  deploy-pages:
    needs: [build-pages]
    if: always() && needs.build-pages.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
