name: Weekly Friday Global Sales Data Update

on:
  schedule:
    # 00:00 UTC Friday = 台灣時間每週五 08:00 CST
    - cron: "0 0 * * 5"
  workflow_dispatch:
    inputs:
      max_bulletins:
        description: "每次撈取保留最新銷售快訊筆數"
        required: false
        default: "15"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-daily-bike"
  cancel-in-progress: false

jobs:
  crawl-weekly-sales:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run weekly Friday global sales crawler & dataset validation
        run: |
          python3 -m pipeline.update_sales_weekly \
            --docs-dir docs \
            --max-bulletins "${{ github.event.inputs.max_bulletins || '15' }}"

      - name: Commit updated weekly sales dataset
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/sales_market.json docs/data/zh_cache.json
          if ! git diff --cached --quiet; then
            git commit -m "chore(weekly-sales): refresh global bicycle sales data & bulletins ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin main
            git push
          else
            echo "No sales dataset changes to commit."
          fi

  build-pages:
    needs: [crawl-weekly-sales]
    if: always() && needs.crawl-weekly-sales.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  deploy-pages:
    needs: [build-pages]
    if: always() && needs.build-pages.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
