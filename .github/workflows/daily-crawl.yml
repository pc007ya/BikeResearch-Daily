name: Daily Bike Intelligence & 3D Reconstruction

on:
  schedule:
    # 23:00 UTC = 台灣時間隔日 07:00 CST
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      max_per_source:
        description: "每個媒體最大抓取篇數"
        required: false
        default: "20"
      max_bikes:
        description: "每日最大 3D 逆向重建整車數"
        required: false
        default: "12"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/daily-crawl.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-daily-bike"
  cancel-in-progress: false

jobs:
  crawl-and-reconstruct:
    outputs:
      published_sha: ${{ steps.commit.outputs.published_sha }}
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - name: Checkout current main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily 7-site crawl, zh-TW translation, 3D reconstruction & PPTX build
        run: |
          python3 -m pipeline.run_daily \
            --docs-dir docs \
            --max-per-source "${{ github.event.inputs.max_per_source || '20' }}" \
            --max-bikes "${{ github.event.inputs.max_bikes || '12' }}" \
            --retention-days 7

      - name: Commit updated daily intelligence & 3D models
        id: commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data docs/models
          if ! git diff --cached --quiet; then
            git commit -m "chore(daily): update cycling intelligence & 3D bike models ($(date -u +'%Y-%m-%d'))"
            git pull --rebase origin main
            git push
          else
            echo "No new changes to commit."
          fi
          echo "published_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  build-pages:
    needs: [crawl-and-reconstruct]
    if: always() && (needs.crawl-and-reconstruct.result == 'success' || needs.crawl-and-reconstruct.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # A scheduled/manual checkout defaults to the old triggering commit, not
      # the output the crawler just pushed. Build from main at job start so
      # neither a delayed push nor a weekly update republishes an old snapshot.
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: refs/heads/main

      - name: Verify Pages snapshot
        env:
          CRAWLER_SHA: ${{ needs.crawl-and-reconstruct.outputs.published_sha }}
        run: |
          head_sha="$(git rev-parse HEAD)"
          echo "Pages snapshot: $head_sha"
          if [[ -n "$CRAWLER_SHA" && "$head_sha" != "$CRAWLER_SHA" ]]; then
            # If main advanced during the run, include the successful crawl
            # plus newer changes; never upload the earlier triggering tree.
            git fetch --no-tags --unshallow origin refs/heads/main
            git merge-base --is-ancestor "$CRAWLER_SHA" "$head_sha"
          fi
          test -s docs/index.html

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  deploy-pages:
    needs: [build-pages]
    if: always() && needs.build-pages.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
