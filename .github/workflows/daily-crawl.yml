name: Daily Bike Intelligence & 3D Reconstruction

on:
  schedule:
    # 23:00 UTC = 台灣時間隔日 07:00 CST
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      max_per_source:
        description: "每個媒體最大抓取篇數"
        required: false
        default: "20"
      max_bikes:
        description: "每日最大 3D 逆向重建整車數"
        required: false
        default: "12"
  push:
    branches: [main]
    paths:
      - "docs/**"
      - ".github/workflows/daily-crawl.yml"

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages-daily-bike"
  cancel-in-progress: false

jobs:
  crawl-and-reconstruct:
    runs-on: ubuntu-latest
    if: github.event_name != 'push'
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Python dependencies
        run: pip install -r requirements.txt

      - name: Run daily 5-site crawl & ALSO-style 3D bike reconstruction
        run: |
          python3 -m pipeline.run_daily \
            --docs-dir docs \
            --max-per-source "${{ github.event.inputs.max_per_source || '20' }}" \
            --max-bikes "${{ github.event.inputs.max_bikes || '12' }}"

      - name: Commit updated daily intelligence & 3D models
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data docs/models
          if ! git diff --cached --quiet; then
            git commit -m "chore(daily): update cycling intelligence & 3D bike models ($(date -u +'%Y-%m-%d'))"
            git push
          else
            echo "No new changes to commit."
          fi

  build-pages:
    needs: [crawl-and-reconstruct]
    if: always() && (needs.crawl-and-reconstruct.result == 'success' || needs.crawl-and-reconstruct.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload docs artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: "docs"

  deploy-pages:
    needs: [build-pages]
    if: always() && needs.build-pages.result == 'success'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
